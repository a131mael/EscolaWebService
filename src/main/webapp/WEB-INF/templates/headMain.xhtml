<h:form style="width:100%; border:none !important">
	<p:growl id="messages" />

	<p:menubar style="width:100%;margin-left: -16px;margin-top: -16px">
	
	<p:menuitem value="Home" url="../secretaria/index.jsf"
			icon="ui-icon-search" rendered="#{authController.hasPermission(authController.administrador,authController.secretaria,authController.financeiro)}"/>
		

		<p:submenu label="Crianças" rendered="#{authController.hasPermission(authController.administrador,authController.secretaria,authController.financeiro)}" >
			
			<p:menuitem value="Alunos" url="../aluno/index.jsf"
				icon="ui-icon-pencil"
				rendered="#{authController.hasPermission(authController.administrador,authController.secretaria)}" />

			<p:menuitem value="TODOS root" url="../aluno/indexRoot.jsf"
				icon="ui-icon-pencil"
				rendered="#{authController.hasPermission(authController.mestre)}" />

			<p:menuitem value="Todos" url="../aluno/indexFinanceiro.jsf"
				icon="ui-icon-pencil"
				rendered="#{authController.hasPermission(authController.financeiro)}" />


			<p:menuitem value="Canceladas" url="../aluno/canceladas.jsf"
				icon="ui-icon-pencil"
				rendered="#{authController.hasPermission(authController.administrador,authController.secretaria)}" />

			<p:menuitem value="Atrasadas" url="../financeiro/atrasados.jsf"
				icon="ui-icon-pencil"
				rendered="#{authController.hasPermission(authController.administrador,authController.secretaria)}" />
		</p:submenu>

			<p:menuitem value="Alunos" url="../professor/alunosProfessor.jsf"
				icon="ui-icon-pencil"
				rendered="#{authController.hasPermission(authController.professor)}" />


			<p:menuitem value="Professores" url="../professor/index.jsf"
				icon="ui-icon-search"
				rendered="#{authController.hasPermission(authController.administrador,authController.secretaria)}" />

			<p:menuitem value="Avaliações" url="../avaliacao/index.jsf"
				icon="ui-icon-close"
				rendered="#{authController.hasPermission(authController.administrador,authController.secretaria,authController.professor)}" />

			<p:menuitem value="Aulas por Disciplina" url="../usuario/index.jsf"
				icon="ui-icon-gear"
				rendered="#{authController.hasPermission(authController.mestre,authController.aluno)}" />
				
			<p:menuitem value="Aulas por semana" url="../usuario/aulasporsemana.jsf"
				icon="ui-icon-gear"
				rendered="#{authController.hasPermission(authController.mestre,authController.aluno)}" />

			<p:menuitem value="Turmas" url="../turma/index.jsf"
				icon="ui-icon-gear"
				rendered="#{authController.hasPermission(authController.administrador,authController.secretaria,authController.professor)}" />

			<p:menuitem value="Aulas" url="../aula/index.jsf"
				icon="ui-icon-gear"
				rendered="#{authController.hasPermission(authController.administrador,authController.secretaria,authController.professor)}" />
				
			<p:menuitem value="Chamada" url="../chamada/index.jsf"
				icon="ui-icon-gear"
				rendered="#{authController.hasPermission(authController.administrador,authController.secretaria,authController.professor)}" />

			<p:menuitem value="Relatórios" url="../relatorio/index.jsf"
				icon="ui-icon-close"
				rendered="#{authController.hasPermission(authController.administrador,authController.secretaria)}" />

			<p:menuitem value="Calendario" url="../calendario/index.jsf"
				icon="ui-icon-close"
				rendered="#{authController.hasPermission(authController.administrador,authController.secretaria,authController.professor)}" />

			<p:submenu label="Financeiro"
				rendered="#{authController.hasPermission(authController.administrador,authController.financeiro)}">

				<p:menuitem value="Baixa" url="../financeiro/baixaManual.jsf"
					icon="ui-icon-close"
					rendered="#{authController.hasPermission(authController.administrador,authController.secretaria,authController.financeiro)}" />

				<p:menuitem value="Extrato Bancario"
					url="../financeiro/extratoBancario.jsf" icon="ui-icon-close"
					rendered="#{authController.hasPermission(authController.administrador,authController.secretaria,authController.financeiro)}" />

				<p:menuitem value="Importar CNAB"
					url="../secretaria/importarCNAB.jsf" icon="ui-icon-close"
					rendered="#{authController.hasPermission(authController.mestre)}" />


				<p:menuitem value="Previsao e Pago"
					url="../financeiro/previsaoEPago.jsf" icon="ui-icon-close"
					rendered="#{authController.hasPermission(authController.administrador,authController.secretaria,authController.financeiro)}" />

				<p:menuitem value="Devedores" url="../devedores/index.jsf"
					icon="ui-icon-close"
					rendered="#{authController.hasPermission(authController.administrador,authController.secretaria,authController.financeiro)}" />

				<p:menuitem value="Protestar" url="../secretaria/protestos.jsf"
					icon="ui-icon-close"
					rendered="#{authController.hasPermission(authController.administrador,authController.secretaria)}" />

				<p:menuitem value="Enviado para Protesto"
					url="../secretaria/protestados.jsf" icon="ui-icon-close"
					rendered="#{authController.hasPermission(authController.administrador,authController.secretaria)}" />


			</p:submenu>
			<p:submenu label="Secretaria"
				rendered="#{authController.hasPermission(authController.administrador,authController.secretaria)}">

				<p:menuitem value="Configuração"
					url="../secretaria/configuracoes.jsf" icon="ui-icon-close"
					rendered="#{authController.hasPermission(authController.mestre)}" />

				<p:menuitem value="Ex-Alunos" url="../secretaria/exAlunos.jsf"
					icon="ui-icon-close"
					rendered="#{authController.hasPermission(authController.administrador,authController.secretaria)}" />

				<p:menuitem value="Alunos ano passado"
					url="../secretaria/alunosUltimoAnoLetivo.jsf" icon="ui-icon-close"
					rendered="#{authController.hasPermission(authController.administrador,authController.secretaria)}" />

				<p:menuitem value="Documentos" url="../secretaria/documentos.jsf"
					icon="ui-icon-close"
					rendered="#{authController.hasPermission(authController.administrador,authController.secretaria)}" />

				<p:menuitem value="Usuarios" url="../admin/listarUsuarios.jsf"
					icon="ui-icon-close"
					rendered="#{authController.hasPermission(authController.administrador)}" />

				<p:menuitem value="Recados" url="../recado/index.jsf"
					icon="ui-icon-close"
					rendered="#{authController.hasPermission(authController.administrador,authController.secretaria)}" />

			</p:submenu>


			<f:facet name="options">
				<!-- <p:inputText style="margin-right:10px" placeholder="Search" /> -->
				<h:commandButton type="button" action="#{authController.logout()}"
					value="Logout" icon="ui-icon-extlink">
					<p:ajax process="@this" />
				</h:commandButton>
			</f:facet>
	</p:menubar>
</h:form>

</html>
